<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Baby ❤️</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
  }

  #passwordScreen, .container, .final {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: inherit;
  }

  input[type="password"] {
    padding: 10px;
    font-size: 1.2em;
    border-radius: 5px;
    border: none;
    margin-bottom: 10px;
  }

  button {
    padding: 10px 20px;
    font-size: 1em;
    border-radius: 5px;
    border: none;
    background: #ff6f91;
    color: white;
    cursor: pointer;
  }

  h1 { font-size: 2em; margin-bottom: 15px; }
  p { font-size: 1.25em; line-height: 1.6; opacity: 0; transition: opacity 0.6s ease; }
  .tap { margin-top: 25px; opacity: 0.8; animation: pulse 1.5s infinite; }

  .heart {
    position: absolute;
    font-size: 24px;
    animation: floatUp 2s ease-out forwards;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-150px) scale(1.5); opacity: 0; }
  }

  @keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
  }

  .final {
    font-size: 2.2em;
    animation: fadeIn 2s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Fireworks */
  canvas {
    position: absolute;
    top:0;
    left:0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Password Screen -->
<div id="passwordScreen">
  <h1>Enter Password to Open</h1>
  <input type="password" id="passwordInput" placeholder="Type here">
  <button onclick="checkPassword()">Open</button>
  <p style="color:#fff; opacity:0.8; margin-top:10px;">Hint: it's your nickname ❤️</p>
</div>

<!-- Main Container -->
<div class="container" style="display:none;" onclick="nextMessage(event)">
  <h1>🎂 Happy Birthday Baby 🎂</h1>
  <p id="message"></p>
  <div class="tap">Tap anywhere 💕</div>
</div>

<!-- Final Screen -->
<div class="final" style="display:none;">
  ❤️ I love you, Baby ❤️<br><br>
  Always. Forever.
</div>

<!-- Fireworks canvas -->
<canvas id="fireworks"></canvas>

<!-- Music -->
<audio id="music" src="meow.mp3" loop></audio>

<script>
const password = "baby"; // set your password here

const passwordScreen = document.getElementById("passwordScreen");
const container = document.querySelector(".container");
const finalScreen = document.querySelector(".final");
const music = document.getElementById("music");
const message = document.getElementById("message");

function checkPassword() {
  const input = document.getElementById("passwordInput").value;
  if(input.toLowerCase() === password) {
    passwordScreen.style.display = "none";
    container.style.display = "flex";
  } else {
    alert("Wrong password! Try again ❤️");
  }
}

// Birthday messages
const messages = [
  "teruntuk cinta hatiku, selamat ulang tahun sayang❤️",
  "lahirnya seseorang bidadari saya.",
  "cinta, memaafkan seseorang itu mudah, namun melupakan seseorang itu sukar.",
  "sampai saat ini, kamu tetap memilihku untuk menjadi peneman hidupmu.",
  "kamu bagaikan permata. dimana aku sanggup bergadai nyawa untuk menjaganya",
  "mencintaimu bukan satu hal yang mudah, namun mencintai mu satu hal yang pasti.",
  "adanya kamu, hidupku terasa tenang.",
  "terima kasih kerana hadir dalam hidupku.",
  "terima kasih kerana sanggup menemaniku disaat aku masih dalam process.",
  "terima kasih kerana sudi menjadi telinga untuk mulutku",
  "terima kasih kerana lahir didunia ini",
  "terima kasih untuk segalanya , cinta",
  "semoga ucapan ini menjadi ucapan terbaik buat kamu dan satu hal yang kamu perlu tahu dan kamu wajib tahu",
  "saya sayang awak, sayang",
  "semoga urusan awak dipermudahkan dan dimurahkan rezeki sayang",
  "Happy Birthday, Nat ❤️"
];

let index = 0;

// Handle taps
function nextMessage(event) {
  createHeart(event.clientX, event.clientY);
  if(index === 0) music.play();
  if(index < messages.length) {
    message.style.opacity = 0;
    setTimeout(()=> {
      message.textContent = messages[index];
      message.style.opacity = 1;
      index++;
    },300);
  } else {
    container.style.display="none";
    finalScreen.style.display="flex";
    startFireworks();
  }
}

// Create floating hearts on tap
function createHeart(x,y) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "❤️";
  heart.style.left = x + "px";
  heart.style.top = y + "px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),2000);
}

// Continuous random hearts
setInterval(()=>{
  const x = Math.random() * window.innerWidth;
  const y = Math.random() * window.innerHeight;
  createHeart(x,y);
},800);

// Fireworks code (simple version)
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function startFireworks() {
  let fireworks = [];
  function randomColor() {
    return `hsl(${Math.random()*360}, 100%, 50%)`;
  }
  function Firework(x,y) {
    this.x=x; this.y=y;
    this.particles=[];
    for(let i=0;i<30;i++){
      this.particles.push({
        x:this.x,
        y:this.y,
        vx:(Math.random()-0.5)*6,
        vy:(Math.random()-0.5)*6,
        alpha:1,
        color: randomColor()
      });
    }
  }
  Firework.prototype.update = function() {
    this.particles.forEach(p=>{
      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=0.05;
      p.alpha-=0.02;
    });
    this.particles = this.particles.filter(p=>p.alpha>0);
  }
  Firework.prototype.draw = function() {
    this.particles.forEach(p=>{
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x,p.y,3,0,2*Math.PI);
      ctx.fill();
    });
  }
  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    fireworks.forEach(f=>{
      f.update();
      f.draw();
    });
    fireworks = fireworks.filter(f=>f.particles.length>0);
    requestAnimationFrame(animate);
  }
  animate();
  // Launch fireworks every 500ms for 5 seconds
  let count = 0;
  let fwInterval = setInterval(()=>{
    fireworks.push(new Firework(Math.random()*canvas.width,Math.random()*canvas.height/2));
    count++;
    if(count>10) clearInterval(fwInterval);
  },500);
}

</script>
</body>
</html>
