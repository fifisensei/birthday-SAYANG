<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HAPPY BIRTHDAY SAYANG SAYA ❤️</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    overflow: hidden;
  }

  .container {
    padding: 20px;
    max-width: 90%;
    z-index: 2;
  }

  h1 {
    font-size: 2em;
    margin-bottom: 15px;
  }

  p {
    font-size: 1.25em;
    line-height: 1.6;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .tap {
    margin-top: 25px;
    opacity: 0.8;
    animation: pulse 1.5s infinite;
  }

  .heart {
    position: absolute;
    font-size: 24px;
    animation: floatUp 2s ease-out forwards;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-150px) scale(1.5); opacity: 0; }
  }

  @keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
  }

  .final {
    font-size: 2.2em;
    animation: fadeIn 2s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>

<body>

<audio id="music" src="olivia-so-easy-to-fall-in-love.mp3" loop></audio>

<div class="container" onclick="nextMessage(event)">
  <h1>🎂 Happy Birthday Baby 🎂</h1>
  <p id="message"></p>
  <div class="tap">Tap anywhere 💕</div>
</div>

<script>
  const messages = [
    "teruntuk cinta hatiku, selamat ulang tahun sayang❤️",
    "lahirnya seseorang bidadari saya.",
    "cinta, memaafkan seseorang itu mudah, namun melupakan seseorang itu sukar.",
    "sampai saat ini, kamu tetap memilihku untuk menjadi peneman hidupmu.",
    "kamu bagaikan permata. dimana aku sanggup bergadai nyawa untuk menjaganya",
    "mencintaimu bukan satu hal yang mudah, namun mencintai mu satu hal yang pasti.",
    "adanya kamu, hidupku terasa tenang.",
    "terima kasih kerana hadir dalam hidupku.",
    "terima kasih kerana sanggup menemaniku disaat aku masih dalam process.",
    "terima kasih kerana sudi menjadi telinga untuk mulutku",
    "terima kasih kerana lahir didunia ini",
    "terima kasih untuk segalanya , cinta",
    "semoga ucapan ini menjadi ucapan terbaik buat kamu dan satu hal yang kamu perlu tahu dan kamu wajib tahu",
    "saya sayang awak, sayang",
    "semoga urusan awak dipermudahkan dan dimurahkan rezeki sayang",
    "Happy Birthday, Nat ❤️"
  ];

  let index = 0;
  const message = document.getElementById("message");
  const music = document.getElementById("music");
  const container = document.querySelector(".container");

  function nextMessage(event) {
    createHeart(event.clientX, event.clientY);

    if (index === 0) music.play();

    if (index < messages.length) {
      message.style.opacity = 0;
      setTimeout(() => {
        message.textContent = messages[index];
        message.style.opacity = 1;
        index++;
      }, 300);
    } else {
      container.innerHTML = `
        <div class="final">
          ❤️ I love you, Baby ❤️<br><br>
          Always. Forever.
        </div>
      `;
    }
  }

  function createHeart(x, y) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "❤️";
    heart.style.left = x + "px";
    heart.style.top = y + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2000);
  }
</script>

</body>
</html>
