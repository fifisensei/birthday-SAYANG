<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Baby ❤️</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    overflow: hidden;
  }

  .container {
    padding: 20px;
    max-width: 90%;
    z-index: 2;
  }

  h1 {
    font-size: 2em;
    margin-bottom: 15px;
  }

  p {
    font-size: 1.25em;
    line-height: 1.6;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .tap {
    margin-top: 25px;
    opacity: 0.8;
    animation: pulse 1.5s infinite;
  }

  .heart {
    position: absolute;
    font-size: 24px;
    animation: floatUp 2s ease-out forwards;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-150px) scale(1.5); opacity: 0; }
  }

  @keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
  }

  .final {
    font-size: 2.2em;
    animation: fadeIn 2s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>

<body>

<audio id="music" src="olivia-so-easy-to-fall-in-love.mp3" loop></audio>

<div class="container" onclick="nextMessage(event)">
  <h1>🎂 Happy Birthday Baby 🎂</h1>
  <p id="message"></p>
  <div class="tap">Tap anywhere 💕</div>
</div>

<script>
  const messages = [
    "Today is special because it’s the day you were born ❤️",
    "And somehow, the world became warmer because of you.",
    "Baby, your smile feels like home to me.",
    "Your laugh is my favorite sound.",
    "Falling in love with you was so easy…",
    "And loving you feels even more natural.",
    "You make my days softer, happier, and brighter.",
    "I’m so grateful for your heart and your love.",
    "I hope this year gives you gentle happiness.",
    "I hope you always feel how deeply you’re loved.",
    "Happy Birthday, Baby ❤️"
  ];

  let index = 0;
  const message = document.getElementById("message");
  const music = document.getElementById("music");
  const container = document.querySelector(".container");

  function nextMessage(event) {
    createHeart(event.clientX, event.clientY);

    if (index === 0) music.play();

    if (index < messages.length) {
      message.style.opacity = 0;
      setTimeout(() => {
        message.textContent = messages[index];
        message.style.opacity = 1;
        index++;
      }, 300);
    } else {
      container.innerHTML = `
        <div class="final">
          ❤️ I love you, Baby ❤️<br><br>
          Always. Forever.
        </div>
      `;
    }
  }

  function createHeart(x, y) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "❤️";
    heart.style.left = x + "px";
    heart.style.top = y + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2000);
  }
</script>

</body>
</html>
